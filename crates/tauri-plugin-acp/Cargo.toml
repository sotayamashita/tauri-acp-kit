[package]
name = "tauri-plugin-acp"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-acp"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "sync",
  "io-util",
  "process",
  "rt",
  "macros",
  "rt-multi-thread",
] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
zip = "2"
sha2 = "0.10"
tempfile = "3"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
